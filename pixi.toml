[workspace]
name = "aaftf-benchmark"
description = "Benchmark suite for AAFTF (see aaftf_benchmark_specification.md)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# Three environments, kept apart so each tool gets the Python and libraries it supports
# (taxpurge's sourmash_plugin_branchwater needs Python >= 3.13):
#   default : Nextflow, AAFTF and its tools, read simulators, helper scripts
#   eval    : QUAST
#   busco   : BUSCO (+ miniprot)
#   plot    : Jupyter, pandas, seaborn, matplotlib for notebooks/benchmark_report.ipynb
# Run from the repository root:
#   pixi install --all
#   pixi run nextflow run workflow/main.nf -params-file config/params.yaml -profile pixi,slurm
# The `pixi` profile in workflow/nextflow.config activates `eval` for QUAST and `busco` for BUSCO.

# AAFTF reference databases (`pixi run AAFTF database required taxpurge`), several GB.
# Folders are searched in order; downloads go to the first writable one (the personal folder),
# the shared lab folder is read-only. Set whenever the default environment is activated
# (pixi run / shell / shell-hook, so also in Nextflow jobs with -profile pixi); an AAFTF_DB you
# export yourself takes precedence.
[activation.env]
AAFTF_DB = "${AAFTF_DB:-/bigdata/stajichlab/ctsai085/databases/aaftf:/srv/projects/db/AAFTF_DB}"

[dependencies]
python = ">=3.13,<3.15"
nextflow = "*"
openjdk = ">=17"

# --- AAFTF runtime: its "default" pixi feature (aaftf/dependency.py REQUIRED_TOOLS) ---
bbmap = ">=39.80,<40"          # trim, filter (bbduk.sh, shuffle.sh, reformat.sh)
spades = "*"                   # assemble (+ cp00 raw baseline)
blast = "*"                    # vecscreen
bwa = "*"
bowtie2 = ">=2.5.5,<3"
samtools = ">=1.24,<2"
minimap2 = "*"                 # rmdup, polish; contig labelling; PAF for D-GENIES dot plots
flye = "*"                     # long / hybrid tracks
racon = "*"                    # long / hybrid polish
polypolish = ">=0.7.1,<0.8"    # hybrid polish
pypolca = ">=0.5.0,<0.6"
freebayes = "*"
biopython = ">=1.88"
psutil = ">=5"
matplotlib-base = ">=3"
packaging = "*"

# --- AAFTF optional tools this benchmark uses ---
novoplasty = "*"               # mito (cp01)
sourmash = ">=4.8"             # taxpurge (cp03 branch A)
sourmash_plugin_branchwater = ">=0.9.15"
ncbi-fcs-gx = "*"              # fcs_gx_purge (cp03 branch B, needs the GX database)
pigz = "*"

# --- read simulation ---
insilicoseq = ">=2.0.1"        # Illumina reads (--readcount_file)
badread = ">=0.4.1"            # ONT reads (depth= headers)

# --- helper scripts ---
pandas = ">=2"
sra-tools = ">=3"              # fetch_reads.sh: fasterq-dump for real datasets
curl = "*"
unzip = "*"
time = "*"                     # GNU time for workflow/scripts/timeit.sh

[feature.eval.dependencies]
python = ">=3.9,<3.12"           # QUAST 5.3 imports distutils, removed in Python 3.12
quast = ">=5.2"

[feature.busco.dependencies]
busco = ">=6.1,<7"              # v6 for OrthoDB v12.2 lineages (-m genome --miniprot)
miniprot = "*"

[feature.plot.dependencies]
python = ">=3.12,<3.14"
pandas = ">=2"
seaborn = ">=0.13"
matplotlib-base = ">=3.8"
jupyterlab = ">=4"
nbconvert = ">=7"
ipykernel = "*"

[feature.plot.tasks]
notebook = { cmd = "jupyter lab notebooks/benchmark_report.ipynb", description = "Open the results notebook (pixi run -e plot notebook)" }

[environments]
eval = { features = ["eval"], no-default-feature = true }
plot = { features = ["plot"], no-default-feature = true }
busco = { features = ["busco"], no-default-feature = true }

[pypi-dependencies]
# pipeline_* / taxpurge / covpurge are newer than the bioconda release; pin the commit you benchmark
aaftf = { git = "https://github.com/stajichlab/AAFTF.git", rev = "ccd6c26" }

[tasks]
fetch-samples = { cmd = "workflow/scripts/fetch_samples.sh", description = "Download fungal references in config/sim_samples.tsv" }
fetch-real = { cmd = "workflow/scripts/fetch_samples.sh config/real_samples.tsv && workflow/scripts/fetch_reads.sh config/real_samples.tsv", description = "Download same-strain references and SRA reads in config/real_samples.tsv" }
fetch-contaminants = { cmd = "workflow/scripts/fetch_contaminants.sh", description = "Download contaminant references in config/contaminants.tsv" }
lint = { cmd = "nextflow lint workflow/main.nf workflow/nextflow.config", description = "Lint the Nextflow workflow" }
benchmark = { cmd = "nextflow run workflow/main.nf -params-file config/params.yaml", description = "Run the benchmark; add e.g. -profile pixi,slurm -resume --tracks short,long" }
