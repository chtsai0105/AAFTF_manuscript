[workspace]
name = "aaftf-benchmark"
description = "Benchmark suite for AAFTF (see aaftf_benchmark_specification.md)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# Three environments, because the tools cannot be solved together: taxpurge's
# sourmash_plugin_branchwater needs Python >= 3.13, compleasm (via sepp/dendropy) needs an older
# Python, and BUSCO's dependencies (augustus/boost) conflict with compleasm's:
#   default : Nextflow, AAFTF and its tools, read simulators, helper scripts
#   eval    : QUAST, compleasm
#   busco   : BUSCO (+ miniprot)
# Run from the repository root:
#   pixi install --all
#   pixi run nextflow run workflow/main.nf -params-file config/params.yaml -profile pixi,slurm
# The `pixi` profile in workflow/nextflow.config activates `eval` for QUAST/COMPLEASM and `busco` for BUSCO.

[dependencies]
python = ">=3.13,<3.15"
nextflow = "*"
openjdk = ">=17"

# --- AAFTF runtime: its "default" pixi feature (aaftf/dependency.py REQUIRED_TOOLS) ---
bbmap = ">=39.80,<40"          # trim, filter (bbduk.sh, shuffle.sh, reformat.sh)
spades = "*"                   # assemble (+ cp00 raw baseline)
blast = "*"                    # vecscreen
bwa = "*"
bowtie2 = ">=2.5.5,<3"
samtools = ">=1.24,<2"
minimap2 = "*"                 # rmdup, polish; also contigs -> references/combined labelling
flye = "*"                     # long / hybrid tracks
racon = "*"                    # long / hybrid polish
polypolish = ">=0.7.1,<0.8"    # hybrid polish
pypolca = ">=0.5.0,<0.6"
freebayes = "*"
biopython = ">=1.88"
psutil = ">=5"
matplotlib-base = ">=3"
packaging = "*"

# --- AAFTF optional tools this benchmark uses ---
novoplasty = "*"               # mito (cp01)
sourmash = ">=4.8"             # taxpurge (cp03 branch A)
sourmash_plugin_branchwater = ">=0.9.15"
ncbi-fcs-gx = "*"              # fcs_gx_purge (cp03 branch B, needs the GX database)
pigz = "*"

# --- read simulation ---
insilicoseq = ">=2.0.1"        # Illumina reads (--readcount_file)
badread = ">=0.4.1"            # ONT reads (depth= headers)

# --- helper scripts ---
pandas = ">=2"
sra-tools = ">=3"              # fetch_reads.sh: fasterq-dump for real datasets
curl = "*"
unzip = "*"
time = "*"                     # GNU time for workflow/scripts/timeit.sh

[feature.eval.dependencies]
quast = ">=5.2"
compleasm = ">=0.2.6"

[feature.busco.dependencies]
busco = ">=5.5,<6"             # v5 as in the spec: -m genome --miniprot with odb10 lineages
miniprot = "*"

[environments]
eval = { features = ["eval"], no-default-feature = true }
busco = { features = ["busco"], no-default-feature = true }

[pypi-dependencies]
# pipeline_* / taxpurge / covpurge are newer than the bioconda release; pin the commit you benchmark
aaftf = { git = "https://github.com/stajichlab/AAFTF.git", rev = "9ce56a1" }

[tasks]
fetch-samples = { cmd = "workflow/scripts/fetch_samples.sh", description = "Download fungal references in config/samples.tsv" }
fetch-real = { cmd = "workflow/scripts/fetch_samples.sh config/real_samples.tsv && workflow/scripts/fetch_reads.sh config/real_samples.tsv", description = "Download same-strain references and SRA reads in config/real_samples.tsv" }
fetch-contaminants = { cmd = "workflow/scripts/fetch_contaminants.sh", description = "Download contaminant references in config/contaminants.tsv" }
lint = { cmd = "nextflow lint workflow/main.nf workflow/nextflow.config", description = "Lint the Nextflow workflow" }
benchmark = { cmd = "nextflow run workflow/main.nf -params-file config/params.yaml", description = "Run the benchmark; add e.g. -profile pixi,slurm -resume --tracks short,long" }
